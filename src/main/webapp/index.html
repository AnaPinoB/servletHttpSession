<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso con HTTP Session</title>
</head>
<body>

    <h1>Iniciar sesión</h1>

    <form action="Servlet1" method="post">

        <label for="nombre">Nombre:</label>

        <input type="text"
               id="nombre"
               name="userName"
               minlength="2"
               maxlength="50"
               required>

        <button type="submit">Ingresar</button>

    </form>

</body>
</html>
